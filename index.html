<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>iqbike - Menu Orderan</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }
        body {
            background-color: #f4f6f9;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .header {
            width: 100%;
            max-width: 400px;
            background-color: #008800;
            color: white;
            padding: 15px;
            text-align: center;
            border-radius: 12px;
            margin-bottom: 20px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        .header-title h1 {
            font-size: 18px;
            font-weight: 800;
            line-height: 1.1;
        }
        .header-title p {
            font-size: 12px;
            opacity: 0.9;
            margin-top: 4px;
        }
        .card {
            width: 100%;
            max-width: 400px;
            background: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
            margin-bottom: 20px;
        }
        .card h3 {
            font-size: 16px;
            margin-bottom: 8px;
            color: #333;
        }
        .card p {
            font-size: 13px;
            color: #666;
            line-height: 1.4;
        }
        .btn-navigasi {
            display: block;
            width: 100%;
            max-width: 400px;
            padding: 14px;
            background-color: #008800;
            color: white;
            text-align: center;
            text-decoration: none;
            font-weight: bold;
            border-radius: 8px;
            border: none;
            cursor: pointer;
            font-size: 16px;
            box-shadow: 0 3px 6px rgba(0,0,0,0.15);
        }
        .btn-navigasi:active {
            background-color: #006600;
        }
    </style>
</head>
<body>

    <div class="header">
        <div class="header-title">
            <h1>iqbike</h1>
            <p>Menu Orderan</p>
        </div>
    </div>

    <div class="card">
        <h3>Detail Orderan</h3>
        <p>Klik tombol di bawah ini untuk melihat peta / rute navigasi tanpa perlu konfirmasi WhatsApp.</p>
    </div>

    <!-- Tombol Navigasi Langsung -->
    <a href="navigasi.html" class="btn-navigasi">Buka Navigasi Rute</a>

</body>
</html>
